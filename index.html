                case 'SET_NOTIFICATIONS':
                    return { ...state, notifications: action.payload };
                case 'ADD_NOTIFICATION':
                    return { ...state, notifications: [action.payload, ...state.notifications] };

                    return { ...state, notifications: state.notifications.map(n => n.id === action.payload ? { ...n, read: true } : n) };

        function WelcomeOverlay({ name, subtitle, initials, avatarColor, gradient, onDismiss }) {
            const [dragY, setDragY] = useState(0);
            const [dragging, setDragging] = useState(false);
            const [closing, setClosing] = useState(false);
            const startY = useRef(0);
            const dismissed = useRef(false);

            const dismiss = () => {
                if (dismissed.current) return;
                dismissed.current = true;
                setClosing(true);
                setTimeout(onDismiss, 320);
            };

            const getY = (e) => (e.touches && e.touches.length ? e.touches[0].clientY : e.clientY);

            const handleDown = (e) => {
                setDragging(true);
                startY.current = getY(e);
            };
            const handleMove = (e) => {
                if (!dragging || closing) return;
                const delta = getY(e) - startY.current;
                if (delta < 0) setDragY(delta);
            };
            const handleUp = () => {
                if (closing) return;
                setDragging(false);
                if (dragY < -70) {
                    dismiss();
                } else {
                    setDragY(0);
                }
            };

            return (
                <div
                    className={`fixed inset-0 z-[60] flex flex-col items-center justify-center overflow-hidden touch-none select-none cursor-pointer transition-transform ${closing ? '-translate-y-full duration-300 ease-in' : 'duration-200 ease-out'}`}
                    style={!closing ? { transform: `translateY(${dragY}px)` } : undefined}
                    onPointerDown={handleDown}
                    onPointerMove={handleMove}
                    onPointerUp={handleUp}
                    onPointerLeave={() => dragging && handleUp()}
                    onClick={dismiss}
                >
                    {/* Blurred gradient backdrop */}
                    <div className={`absolute inset-0 bg-gradient-to-br ${gradient}`} />
                    <div className="absolute -top-24 -left-20 w-80 h-80 rounded-full bg-white/30 blur-3xl pointer-events-none" />

                                                    {n.type === 'error' && <AlertCircle size={16} className="text-rose-500" />}

        // ─── Admin App ────────────────────────────────────────────────────────────

        function AdminApp({ onLogout, user }) {
            const { state, dispatch } = useApp();
            const [active, setActive] = useState("dashboard");
            const [showWelcome, setShowWelcome] = useState(true);
            const [showAddEmp, setShowAddEmp] = useState(false);
            const [showAddJob, setShowAddJob] = useState(false);
            const [showAddAnnouncement, setShowAddAnnouncement] = useState(false);
            const [showEmpDetail, setShowEmpDetail] = useState(null);
            const [newEmp, setNewEmp] = useState({ name: "", email: "", jobTitle: "", role: "employee", department: DEPARTMENTS[0] });
            const [newJob, setNewJob] = useState({ title: "", department: DEPARTMENTS[0] });
            const [newAnnouncement, setNewAnnouncement] = useState({ title: "", content: "", department: "All" });
            const [empSearch, setEmpSearch] = useState("");
            const [empFilterDept, setEmpFilterDept] = useState("All");
            const [empFilterStatus, setEmpFilterStatus] = useState("All");
            const [activity, setActivity] = useState(["System initialized — Ready"]);
            const [collapsed, setCollapsed] = useState(false);
            const [analyticsFilter, setAnalyticsFilter] = useState("all");
            const [calendarMonth, setCalendarMonth] = useState(new Date().getMonth());
            const [calendarYear, setCalendarYear] = useState(new Date().getFullYear());
            const addToast = useToast();
            const { dark, toggle } = useTheme();

            const isManager = user?.role === 'manager';
            const isAdmin = user?.role === 'admin';
            const userDept = user?.department;

            const employees = state.employees;
            const leaveRequests = state.leaveRequests;
            const jobs = state.jobs;
            const onboarding = state.onboardingTasks;
            const payroll = state.payroll;
            const performance = state.performance;
            const announcements = state.announcements;

            const t = (key) => TRANSLATIONS[state.language][key] || key;

            // ─── Filter data for manager ──────────────────────────────────────────
            const visibleEmployees = isManager ? employees.filter(e => e.department === userDept || e.id === user.id) : employees;
            const visibleLeaveRequests = isManager ? leaveRequests.filter(l => {
                const emp = employees.find(e => e.id === l.employeeId);
                return emp?.department === userDept;
            }) : leaveRequests;
            const visibleJobs = isManager ? jobs.filter(j => j.department === userDept) : jobs;
            const visibleOnboarding = isManager ? onboarding.filter(o => {
                const emp = employees.find(e => e.name === o.employee);
                return emp?.department === userDept;
            }) : onboarding;
            const visiblePayroll = isManager ? payroll.filter(p => {
                const emp = employees.find(e => e.name === p.employee);
                return emp?.department === userDept;
            }) : payroll;
            // Managers only see announcements that are global or targeted at their own department
            const visibleAnnouncements = isManager ? announcements.filter(a => !a.department || a.department === 'All' || a.department === userDept) : announcements;

            // ─── Item lists ────────────────────────────────────────────────────────
            const baseItems = [
                { key: "dashboard", label: t('dashboard'), icon: LayoutGrid },
                { key: "employees", label: t('employees'), icon: Users },
                { key: "org", label: t('orgStructure'), icon: Building2 },
                { key: "attendance", label: t('attendance'), icon: Clock },
                { key: "leave", label: t('leaveManagement'), icon: Calendar },
                { key: "recruitment", label: t('recruitment'), icon: Briefcase },
                { key: "onboarding", label: t('onboarding'), icon: ClipboardCheck },
                { key: "payroll", label: t('payroll'), icon: DollarSign },
                { key: "performance", label: t('performance'), icon: TrendingUp },
                { key: "announcements", label: t('announcements'), icon: Megaphone },
                { key: "analytics", label: t('analytics'), icon: PieChart },
            ];

            const managerItems = [
                { key: "dashboard", label: t('dashboard'), icon: LayoutGrid },
                { key: "myTeam", label: t('myTeam'), icon: UsersRound },
                { key: "org", label: t('orgStructure'), icon: Building2 },
                { key: "attendance", label: t('attendance'), icon: Clock },
                { key: "leave", label: t('leaveManagement'), icon: Calendar },
                { key: "recruitment", label: t('recruitment'), icon: Briefcase },
                { key: "onboarding", label: t('onboarding'), icon: ClipboardCheck },
                { key: "payroll", label: t('payroll'), icon: DollarSign },
                { key: "performance", label: t('performance'), icon: TrendingUp },
                { key: "announcements", label: t('announcements'), icon: Megaphone },
                { key: "analytics", label: t('analytics'), icon: PieChart },
            ];

            const items = isManager ? managerItems : baseItems;

            // ─── Handlers ──────────────────────────────────────────────────────────
            const addNotification = (msg, type = 'info', link = null) => {
                dispatch({ type: 'ADD_NOTIFICATION', payload: { id: Date.now(), message: msg, type, read: false, date: new Date().toISOString(), link } });
            };

            const logActivity = (msg) => {
                setActivity(a => [msg, ...a].slice(0, 8));
                addToast(msg, 'info', 2500);
            };

            const sendEmail = (to, subject, body) => {
                addToast(`📧 Email sent to ${to}: ${subject}`, 'success');
            };

            const awardPoints = (userId, points, reason) => {
                const emp = employees.find(e => e.id === userId);
                if (emp) {
                    const updated = employees.map(e => e.id === userId ? { ...e, points: (e.points || 0) + points } : e);
                    dispatch({ type: 'SET_EMPLOYEES', payload: updated });
                    addNotification(`${emp.name} earned ${points} points for ${reason}!`, 'success');
                    addToast(`🏆 ${points} points awarded to ${emp.name}`, 'success');
                }
            };

            // ─── Add Employee ──────────────────────────────────────────────────────
            // Only Admins may assign a system role (admin/manager/employee). Managers
            // can add employees to their own team, but the new hire's role is always
            // forced to "employee" and their department locked to the manager's dept.
            const addEmployee = () => {
                if (!newEmp.name || !newEmp.email) { addToast("Please fill in all fields", 'error'); return; }
                const emp = {
                    id: Date.now(),
                    name: newEmp.name,
                    email: newEmp.email,
                    jobTitle: newEmp.jobTitle,
                    role: isAdmin ? (newEmp.role || 'employee') : 'employee',
                    department: isManager ? userDept : newEmp.department,
                    password: "employee123",
                    status: "Active",
                    joined: new Date().toISOString().slice(0, 10),
                    color: EMPLOYEE_COLORS[employees.length % EMPLOYEE_COLORS.length],
                    leaveBalance: { annual: 10, sick: 10, personal: 3 },
                    points: 0,
                };
                dispatch({ type: 'SET_EMPLOYEES', payload: [emp, ...employees] });
                logActivity(`Added employee — ${emp.name}`);
                sendEmail(emp.email, "Welcome to PeopleHub", "Your account has been created.");
                setNewEmp({ name: "", email: "", jobTitle: "", role: "employee", department: isManager ? userDept : DEPARTMENTS[0] });
                setShowAddEmp(false);
                addToast(`✅ ${emp.name} added`, 'success');
            };

            // ─── Remove Employee ──────────────────────────────────────────────────
            const removeEmployee = (id) => {
                const emp = employees.find(e => e.id === id);
                if (emp && emp.role === 'admin') { addToast("Cannot remove admin", 'error'); return; }
                dispatch({ type: 'SET_EMPLOYEES', payload: employees.filter(e => e.id !== id) });
                logActivity(`Removed employee — ${emp?.name}`);
                addToast(`🗑️ ${emp?.name} removed`, 'warning');
            };

            // ─── Jobs ──────────────────────────────────────────────────────────────
            const addJob = () => {
                if (!newJob.title) { addToast("Please enter a job title", 'error'); return; }
                const job = { id: Date.now(), ...newJob, status: "Open", applicants: 0 };
                dispatch({ type: 'SET_JOBS', payload: [job, ...jobs] });
                logActivity(`Posted job — ${job.title}`);
                setNewJob({ title: "", department: DEPARTMENTS[0] });
                setShowAddJob(false);
                addToast(`📋 ${job.title} posted`, 'success');
            };

            // ─── Leave ─────────────────────────────────────────────────────────────
            const decideLeave = (id, decision) => {
                const updated = leaveRequests.map(l => l.id === id ? { ...l, status: decision } : l);
                dispatch({ type: 'SET_LEAVE_REQUESTS', payload: updated });
                const l = leaveRequests.find(x => x.id === id);
                if (l) {
                    logActivity(`${decision} leave for ${l.employee}`);
                    addNotification(`${l.employee}'s leave was ${decision}`, decision === 'Approved' ? 'success' : 'error');
                    sendEmail(l.employee, `Leave ${decision}`, `Your leave request for ${l.from} to ${l.to} has been ${decision}.`);
                    if (decision === 'Approved') {
                        awardPoints(l.employeeId, 5, "Leave approved");
                    }
                }
            };

            // ─── Onboarding ────────────────────────────────────────────────────────
            const toggleOnboarding = (id) => {
                const updated = onboarding.map(t => t.id === id ? { ...t, status: t.status === "Done" ? "Pending" : "Done" } : t);
                dispatch({ type: 'SET_ONBOARDING', payload: updated });
                const t = onboarding.find(x => x.id === id);
                if (t && t.status === "Pending") {
                    const emp = employees.find(e => e.name === t.employee);
                    if (emp) awardPoints(emp.id, 10, "Completed onboarding task");
                }
            };

            // ─── Payroll ───────────────────────────────────────────────────────────
            const processPayroll = () => {
                const updated = payroll.map(p => ({ ...p, status: "Paid" }));
                dispatch({ type: 'SET_PAYROLL', payload: updated });
                logActivity("Processed payroll for August 2026");
                addToast("💰 Payroll processed", 'success');
                addNotification("Payroll for August 2026 has been processed.", 'success');
            };

            // ─── Announcements ─────────────────────────────────────────────────────
            // Managers can only post to their own department (locked in the UI).
            // Admins may target a specific department or "All" for a global post.
            const addAnnouncement = () => {
                if (!newAnnouncement.title || !newAnnouncement.content) { addToast("Please fill in all fields", 'error'); return; }
                const targetDept = isManager ? userDept : (newAnnouncement.department || "All");
                const ann = { id: Date.now(), title: newAnnouncement.title, content: newAnnouncement.content, department: targetDept, date: new Date().toISOString().slice(0, 10), pinned: false };
                dispatch({ type: 'SET_ANNOUNCEMENTS', payload: [ann, ...announcements] });
                logActivity(`Posted announcement — ${ann.title}`);
                setNewAnnouncement({ title: "", content: "", department: isManager ? userDept : "All" });
                setShowAddAnnouncement(false);
                addToast(`📢 ${ann.title} posted`, 'success');
                addNotification(`New announcement: ${ann.title}`, 'info');
                // Simulate email to affected employees only (global or matching department)
                employees.forEach(emp => {
                    if (emp.role === 'employee' && (targetDept === 'All' || emp.department === targetDept)) {
                        sendEmail(emp.email, "New Announcement", ann.content);
                    }
                });
            };

            const deleteAnnouncement = (id) => {
                dispatch({ type: 'SET_ANNOUNCEMENTS', payload: announcements.filter(a => a.id !== id) });
            };

            const togglePin = (id) => {
                dispatch({ type: 'SET_ANNOUNCEMENTS', payload: announcements.map(a => a.id === id ? { ...a, pinned: !a.pinned } : a) });
            };

            // ─── Analytics ──────────────────────────────────────────────────────────
            const deptStats = DEPARTMENTS.map(d => ({
                name: d,
                count: employees.filter(e => e.department === d).length,
            }));
            const maxDeptCount = Math.max(...deptStats.map(d => d.count), 1);

            const leaveStats = {
                pending: visibleLeaveRequests.filter(l => l.status === 'Pending').length,
                approved: visibleLeaveRequests.filter(l => l.status === 'Approved').length,
                rejected: visibleLeaveRequests.filter(l => l.status === 'Rejected').length,
            };

            const turnoverRate = ((employees.filter(e => e.status === 'Inactive').length / employees.length) * 100).toFixed(1) || 0;

            // ─── Leaderboard ──────────────────────────────────────────────────────
            const leaderboard = [...employees].sort((a, b) => (b.points || 0) - (a.points || 0)).slice(0, 10);

            // ─── Calendar ──────────────────────────────────────────────────────────
            const getDaysInMonth = (month, year) => new Date(year, month + 1, 0).getDate();
            const getFirstDay = (month, year) => new Date(year, month, 1).getDay();

            const renderCalendar = () => {
                const days = getDaysInMonth(calendarMonth, calendarYear);
                const firstDay = getFirstDay(calendarMonth, calendarYear);
                const today = new Date();
                const isToday = (d) => today.getDate() === d && today.getMonth() === calendarMonth && today.getFullYear() === calendarYear;

                const leavesOnDate = (d) => {
                    const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    return visibleLeaveRequests.filter(l => l.from <= dateStr && l.to >= dateStr);
                };

                let rows = [];
                let cells = [];
                for (let i = 0; i < firstDay; i++) {
                    cells.push(<div key={`empty-${i}`} className="h-8 w-8"></div>);
                }
                for (let d = 1; d <= days; d++) {
                    const le = leavesOnDate(d);
                    const hasLeave = le.length > 0;
                    const isPending = le.some(l => l.status === 'Pending');
                    const isApproved = le.some(l => l.status === 'Approved');
                    cells.push(
                        <div key={d} className={`h-8 w-8 rounded-full flex items-center justify-center text-sm font-medium relative ${isToday(d) ? 'ring-2 ring-[#0B57D0]' : ''} ${hasLeave ? (isPending ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300') : 'text-[#1D1B20] dark:text-[#E6E1E9]'}`}>
                            {d}
                            {hasLeave && <span className="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-[#0B57D0] dark:bg-[#7BC0FF]"></span>}
                        </div>
                    );
                    if ((firstDay + d) % 7 === 0 || d === days) {
                        rows.push(<div key={`row-${d}`} className="flex gap-1 justify-between">{cells}</div>);
                        cells = [];
                    }
                }
                return rows;
            };

            // ─── Search ────────────────────────────────────────────────────────────
            const handleGlobalSearch = (term) => {
                setEmpSearch(term);
            };

            // ─── Filters ───────────────────────────────────────────────────────────
            const filteredEmployees = visibleEmployees.filter(e => {
                const matchName = e.name.toLowerCase().includes(empSearch.toLowerCase()) || e.email.toLowerCase().includes(empSearch.toLowerCase());
                const matchDept = empFilterDept === "All" || e.department === empFilterDept;
                const matchStatus = empFilterStatus === "All" || e.status === empFilterStatus;
                return matchName && matchDept && matchStatus;
            });

            // ─── Print Payslip ─────────────────────────────────────────────────────
            const printPayslip = (payslip) => {
                const printWindow = window.open('', '_blank', 'width=600,height=400');
                if (printWindow) {
                    printWindow.document.write(`
                        <html><head><title>Payslip ${payslip.month}</title>
                        <style>body { font-family: Roboto, sans-serif; padding: 2rem; } .container { max-width: 400px; margin: auto; border: 1px solid #ccc; padding: 2rem; border-radius: 8px; } .header { text-align: center; border-bottom: 1px solid #ddd; padding-bottom: 1rem; } .row { display: flex; justify-content: space-between; padding: 0.5rem 0; } .label { font-weight: 600; } .total { border-top: 2px solid #000; padding-top: 0.5rem; margin-top: 0.5rem; }</style>
                        </head><body>
                        <div class="container">
                            <div class="header"><h2>PeopleHub HRMS</h2><p>Payslip for ${payslip.month}</p></div>
                            <div class="row"><span class="label">Employee:</span><span>${payslip.employee}</span></div>
                            <div class="row"><span class="label">Amount:</span><span>$${payslip.amount.toLocaleString()}</span></div>
                            <div class="row"><span class="label">Status:</span><span>${payslip.status}</span></div>
                            <div class="row total"><span class="label">Net Pay:</span><span>$${payslip.amount.toLocaleString()}</span></div>

                { id: 2, type: "Vacation", from: "2026-09-21", to: "2026-09-22", days: 2, status: "Approved" },
            ]);
            const [pendingLeaves, setPendingLeaves] = useState(0);
            const [showRequest, setShowRequest] = useState(false);
            const [form, setForm] = useState({ type: "Vacation", from: "", to: "" });
            const [week, setWeek] = useState([
                { day: "Mon", status: "Present" },
                { day: "Tue", status: "Present" },
                { day: "Wed", status: "Absent" },
                { day: "Thu", status: "Present" },
                { day: "Fri", status: "Not marked" },
                { day: "Sat", status: "Weekend" },
                { day: "Sun", status: "Weekend" },
            ]);
            const [checkedIn, setCheckedIn] = useState(false);
            const [documents, setDocuments] = useState([
                { id: 1, name: "Employment Contract.pdf", date: "2026-06-10" },
                { id: 2, name: "ID Verification.pdf", date: "2026-06-11" },
                { id: 3, name: "NDA Agreement.pdf", date: "2026-06-12" },
            ]);
            const [payslips] = useState([
                { id: 1, month: "July 2026", amount: 1200 },
                { id: 2, month: "June 2026", amount: 1200 },
                { id: 3, month: "May 2026", amount: 1150 },
                { id: 4, month: "April 2026", amount: 1150 },
            ]);
            const [profile, setProfile] = useState({
                name: user.name,
                role: user.role,
                department: user.department,
                email: user.email,
                phone: "+60 12-345 6789",
            });
            const [collapsed, setCollapsed] = useState(false);
            const [showDocPreview, setShowDocPreview] = useState(null);
            const [calendarMonth, setCalendarMonth] = useState(new Date().getMonth());
            const [calendarYear, setCalendarYear] = useState(new Date().getFullYear());
            const addToast = useToast();
            const { dark, toggle } = useTheme();

            const t = (key) => TRANSLATIONS[state.language][key] || key;

            const items = [
                { key: "dashboard", label: t('dashboard'), icon: LayoutGrid },
                { key: "profile", label: t('myProfile'), icon: User },
                { key: "attendance", label: t('attendance'), icon: Clock },
                { key: "leave", label: t('leaveRequests'), icon: Calendar },
                { key: "payslips", label: t('payslips'), icon: FileText },
                { key: "documents", label: t('documents'), icon: Upload },
                { key: "announcements", label: t('announcements'), icon: Megaphone },
                { key: "leaderboard", label: t('leaderboard'), icon: Trophy },
            ];

            const presentCount = week.filter(d => d.status === "Present").length;

            const addNotification = (msg, type = 'info') => {
                dispatch({ type: 'ADD_NOTIFICATION', payload: { id: Date.now(), message: msg, type, read: false, date: new Date().toISOString(), link: null } });
            };

            const sendEmail = (to, subject, body) => {
                addToast(`📧 Email sent to ${to}: ${subject}`, 'success');
            };

            const awardPoints = (userId, points, reason) => {
                const emp = state.employees.find(e => e.id === userId);
                if (emp) {
                    const updated = state.employees.map(e => e.id === userId ? { ...e, points: (e.points || 0) + points } : e);
                    dispatch({ type: 'SET_EMPLOYEES', payload: updated });
                    addNotification(`You earned ${points} points for ${reason}!`, 'success');
                    addToast(`🏆 +${points} points!`, 'success');
                }
            };

            const submitLeave = () => {
                if (!form.from || !form.to) { addToast("Please select dates", 'error'); return; }
                const days = Math.max(1, (new Date(form.to) - new Date(form.from)) / 86400000 + 1);
                const newLeave = { id: Date.now(), employeeId: user.id, employee: user.name, type: form.type, from: form.from, to: form.to, days, status: "Pending" };
                // Add to global leave requests
                const updated = [...state.leaveRequests, newLeave];
                dispatch({ type: 'SET_LEAVE_REQUESTS', payload: updated });
                setLeaves(l => [{ id: Date.now(), type: form.type, from: form.from, to: form.to, days, status: "Pending" }, ...l]);
                setPendingLeaves(p => p + 1);
                setForm({ type: "Vacation", from: "", to: "" });
                setShowRequest(false);
                addToast("📅 Leave request submitted", 'success');
                addNotification("Leave request submitted for approval.", 'info');
                sendEmail("manager@peoplehub.com", "Leave Request", `${user.name} requested ${form.type} leave from ${form.from} to ${form.to}.`);
            };

            const checkIn = () => {
                const now = new Date();
                const isEarly = now.getHours() < 9;
                setCheckedIn(true);
                setWeek(w => w.map((d, i) => i === 4 ? { ...d, status: "Present" } : d));
                addToast("✅ Checked in successfully", 'success');
                if (isEarly) {
                    awardPoints(user.id, 5, "Early check-in (before 9 AM)");
                } else {
                    awardPoints(user.id, 1, "Check-in");
                }
            };

            // Employees only see announcements that are global ("All") or targeted at their own department
            const visibleAnnouncements = state.announcements.filter(a => !a.department || a.department === 'All' || a.department === user.department);
            const sortedAnnouncements = [...visibleAnnouncements].sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return new Date(b.date) - new Date(a.date);
            });
            const recentAnnouncements = sortedAnnouncements.slice(0, 3);

            const leaderboard = [...state.employees].sort((a, b) => (b.points || 0) - (a.points || 0)).slice(0, 10);

            const printPayslip = (payslip) => {
                const printWindow = window.open('', '_blank', 'width=600,height=400');
                if (printWindow) {
                    printWindow.document.write(`
                        <html><head><title>Payslip ${payslip.month}</title>
                        <style>body { font-family: Roboto, sans-serif; padding: 2rem; } .container { max-width: 400px; margin: auto; border: 1px solid #ccc; padding: 2rem; border-radius: 8px; } .header { text-align: center; border-bottom: 1px solid #ddd; padding-bottom: 1rem; } .row { display: flex; justify-content: space-between; padding: 0.5rem 0; } .label { font-weight: 600; } .total { border-top: 2px solid #000; padding-top: 0.5rem; margin-top: 0.5rem; }</style>
                        </head><body>
                        <div class="container">
                            <div class="header"><h2>PeopleHub HRMS</h2><p>Payslip for ${payslip.month}</p></div>
                            <div class="row"><span class="label">Employee:</span><span>${payslip.employee}</span></div>
                            <div class="row"><span class="label">Amount:</span><span>$${payslip.amount.toLocaleString()}</span></div>
                            <div class="row total"><span class="label">Net Pay:</span><span>$${payslip.amount.toLocaleString()}</span></div>
                        </div>
                        </body></html>
                    `);
                    printWindow.document.close();
                    printWindow.print();
                }
            };

            // Calendar for employee
            const getDaysInMonth = (month, year) => new Date(year, month + 1, 0).getDate();
            const getFirstDay = (month, year) => new Date(year, month, 1).getDay();

            const renderCalendar = () => {
                const days = getDaysInMonth(calendarMonth, calendarYear);
                const firstDay = getFirstDay(calendarMonth, calendarYear);
                const today = new Date();
                const isToday = (d) => today.getDate() === d && today.getMonth() === calendarMonth && today.getFullYear() === calendarYear;

                const leavesOnDate = (d) => {
                    const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                    return state.leaveRequests.filter(l => l.employeeId === user.id && l.from <= dateStr && l.to >= dateStr);
                };

                let rows = [];
                let cells = [];
                for (let i = 0; i < firstDay; i++) {
                    cells.push(<div key={`empty-${i}`} className="h-8 w-8"></div>);
                }
                for (let d = 1; d <= days; d++) {
                    const le = leavesOnDate(d);
                    const hasLeave = le.length > 0;
                    const isPending = le.some(l => l.status === 'Pending');
                    const isApproved = le.some(l => l.status === 'Approved');
                    cells.push(
                        <div key={d} className={`h-8 w-8 rounded-full flex items-center justify-center text-sm font-medium relative ${isToday(d) ? 'ring-2 ring-[#0B57D0]' : ''} ${hasLeave ? (isPending ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300' : 'bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300') : 'text-[#1D1B20] dark:text-[#E6E1E9]'}`}>
                            {d}
                            {hasLeave && <span className="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-[#0B57D0] dark:bg-[#7BC0FF]"></span>}
                        </div>
                    );
                    if ((firstDay + d) % 7 === 0 || d === days) {
                        rows.push(<div key={`row-${d}`} className="flex gap-1 justify-between">{cells}</div>);
                        cells = [];
                    }
                }
                return rows;
            };

                <>
                    {showWelcome && (
                        <WelcomeOverlay
                            name={`Welcome, ${profile.name.split(" ")[0]}!`}
                            subtitle={`${profile.role} • ${profile.department}`}
                            initials={profile.name.split(" ").map(n => n[0]).slice(0, 2).join("")}
                            avatarColor="bg-fuchsia-500"
                            gradient="from-fuchsia-600 via-pink-500 to-rose-500"
                            onDismiss={() => setShowWelcome(false)}
                        />

                        icon={Users}
                        items={items}
                        active={active}
                        setActive={setActive}
                        onLogout={onLogout}
                        collapsed={collapsed}

                                    {profile.name.split(" ").map(n => n[0]).join("")}

                                {!collapsed && (
                                    <div>
                                        <p className="font-semibold text-[#1D1B20] dark:text-[#E6E1E9] text-sm leading-tight">{profile.name}</p>
                                        <p className="text-xs text-[#938F99] dark:text-[#88849A]">{profile.role}</p>
                                    </div>

                                        <StatCard label="Upcoming Leaves" value={state.leaveRequests.filter(l => l.employeeId === user.id && l.status === 'Approved').length} icon={FileText} color="bg-blue-500" />
                                        <StatCard label="Points" value={user.points || 0} icon={Trophy} color="bg-amber-500" />

                                    {visibleAnnouncements.length > 0 && (

                                                <h3 className="font-medium text-[#1D1B20] dark:text-[#E6E1E9] g-title">{t('announcements')}</h3>
                                            </div>
                                            <div className="space-y-2">
                                                {recentAnnouncements.map(a => (
                                                    <div key={a.id} className="flex items-start gap-3 text-sm">
                                                        {a.pinned && <span className="text-xs font-medium text-[#0B57D0] dark:text-[#7BC0FF]">📌</span>}

                                                            <p className="font-medium text-[#1D1B20] dark:text-[#E6E1E9]">{a.title}</p>
                                                            <p className="text-[#49454F] dark:text-[#A9A5B0] text-xs line-clamp-2">{a.content}</p>
                                                            <span className="text-xs text-[#79747E] dark:text-[#88849A]">{a.date}</span>

                                                    <button onClick={() => setActive("announcements")} className="text-[#0B57D0] dark:text-[#7BC0FF] text-sm font-medium">
                                                        {t('viewAll')}
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                        <div className="bg-[#FFFBFE] dark:bg-[#2C2A30] rounded-[28px] border border-[#E3E1E6] dark:border-[#3D3B43] p-6">

                                            <div className="space-y-3 max-h-48 overflow-y-auto">
                                                {state.leaveRequests.filter(l => l.employeeId === user.id && l.status === "Approved").slice(0, 4).map(l => (
                                                    <div key={l.id} className="flex items-center justify-between bg-[#F3F1F7] dark:bg-[#35333A] rounded-[28px] px-4 py-3">

                                                        <StatusPill status="Approved" />
                                                    </div>

                                                {state.leaveRequests.filter(l => l.employeeId === user.id && l.status === "Approved").length === 0 && <p className="text-[#79747E] dark:text-[#88849A] text-sm">No upcoming leaves</p>}

                                        </div>
                                        <div className="bg-[#FFFBFE] dark:bg-[#2C2A30] rounded-[28px] border border-[#E3E1E6] dark:border-[#3D3B43] p-6">
                                            <h3 className="font-medium text-[#1D1B20] dark:text-[#E6E1E9] mb-4 g-title">{t('quickActions') || "Quick Actions"}</h3>
                                            <div className="space-y-3">

                                                    {t('requestLeave')}
                                                </button>
                                                <button onClick={checkIn} disabled={checkedIn} className={`w-full font-semibold rounded-full py-2.5 text-sm ${checkedIn ? "bg-[#E3E1E6] dark:bg-[#3D3B43] text-[#79747E] dark:text-[#88849A]" : "bg-emerald-600 hover:bg-emerald-700 text-white"}`}>
                                                    {checkedIn ? "✅ " + t('checkInToday') : t('checkIn')}
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {active === "profile" && (
                                <div className="max-w-xl">
                                    <h2 className="text-[26px] font-medium text-[#1D1B20] dark:text-[#E6E1E9] g-title mb-5">{t('myProfile')}</h2>
                                    <div className="bg-[#FFFBFE] dark:bg-[#2C2A30] rounded-[28px] border border-[#E3E1E6] dark:border-[#3D3B43] p-6 space-y-4">
                                        {[
                                            ["name", "Full name"],
                                            ["role", "Job title"],
                                            ["department", "Department"],
                                            ["email", "Email"],
                                            ["phone", "Phone"],
                                        ].map(([key, label]) => (
                                            <div key={key}>
                                                <label className="text-sm font-semibold text-[#49454F] dark:text-[#A9A5B0]">{label}</label>
                                                <input
                                                    value={profile[key]}
                                                    onChange={e => setProfile({ ...profile, [key]: e.target.value })}
                                                    className="w-full bg-[#ECE6F0] dark:bg-[#35333A] rounded-full px-5 py-2.5 text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-[#0B57D0] dark:focus:ring-[#1A5A9A] text-[#1D1B20] dark:text-[#E6E1E9]"
                                                />
                                            </div>
                                        ))}
                                        <button onClick={() => { addToast("✅ Profile updated successfully", 'success');
                                            addNotification("Profile updated.", 'success'); }} className="w-full bg-[#0B57D0] dark:bg-[#1A5A9A] hover:bg-[#0842A0] dark:hover:bg-[#2A6AAA] text-white font-semibold rounded-full py-2.5">
                                            {t('saveChanges')}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {active === "attendance" && (
                                <div>
                                    <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
                                        <h2 className="text-[26px] font-medium text-[#1D1B20] dark:text-[#E6E1E9] g-title">{t('attendance')}</h2>
                                        <button onClick={checkIn} disabled={checkedIn} className={`text-sm font-semibold rounded-full px-4 py-2 flex items-center gap-1.5 ${checkedIn ? "bg-[#E3E1E6] dark:bg-[#3D3B43] text-[#79747E] dark:text-[#88849A]" : "bg-emerald-600 hover:bg-emerald-700 text-white"}`}>
                                            <CalendarDays size={16} /> {checkedIn ? t('checkInToday') : t('checkIn')}
                                        </button>
                                    </div>
                                    <div className="grid grid-cols-7 gap-3">
                                        {week.map(d => (
                                            <div key={d.day} className="bg-[#FFFBFE] dark:bg-[#2C2A30] rounded-[28px] border border-[#E3E1E6] dark:border-[#3D3B43] p-4 text-center">
                                                <p className="text-sm font-semibold text-[#49454F] dark:text-[#A9A5B0] mb-2">{d.day}</p>
                                                <StatusPill status={d.status} />
                                            </div>
                                        ))}
                                    </div>
                                    <div className="mt-4 bg-[#FFFBFE] dark:bg-[#2C2A30] rounded-[28px] border border-[#E3E1E6] dark:border-[#3D3B43] p-5">
                                        <div className="flex justify-between text-sm mb-2">
                                            <span className="text-[#49454F] dark:text-[#A9A5B0]">Weekly Attendance</span>
                                            <span className="text-[#1D1B20] dark:text-[#E6E1E9] font-medium">{presentCount}/5 work days</span>
                                        </div>
                                        <div className="w-full h-2 bg-[#ECEAF0] dark:bg-[#3D3B43] rounded-full overflow-hidden">
                                            <div className="h-full bg-emerald-500 dark:bg-emerald-400 rounded-full transition-all duration-700" style={{ width: `${(presentCount / 5) * 100}%` }} />
                                        </div>
                                    </div>
                                </div>
                            )}

                            {active === "leave" && (
                                <div>
                                    <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
                                        <h2 className="text-[26px] font-medium text-[#1D1B20] dark:text-[#E6E1E9] g-title">{t('leaveRequests')}</h2>
                                        <button onClick={() => setShowRequest(true)} className="bg-[#0B57D0] dark:bg-[#1A5A9A] hover:bg-[#0842A0] dark:hover:bg-[#2A6AAA] text-white text-sm font-semibold rounded-full px-4 py-2 flex items-center gap-1.5">
                                            <PlusCircle size={16} /> {t('requestLeave')}
                                        </button>
                                    </div>
                                    <div className="bg-[#FFFBFE] dark:bg-[#2C2A30] rounded-[28px] border border-[#E3E1E6] dark:border-[#3D3B43] divide-y divide-[#ECEAF0] dark:divide-[#35333A]">
                                        {state.leaveRequests.filter(l => l.employeeId === user.id).map(l => (
                                            <div key={l.id} className="flex items-center justify-between px-5 py-4">
                                                <div>
                                                    <p className="font-semibold text-[#1D1B20] dark:text-[#E6E1E9]">{l.type}</p>
                                                    <p className="text-xs text-[#79747E] dark:text-[#88849A]">{l.from} → {l.to} ({l.days} days)</p>
                                                </div>
                                                <StatusPill status={l.status} />
                                            </div>
                                        ))}
                                    </div>

                                    {/* Calendar */}
                                    <div className="mt-6 bg-[#FFFBFE] dark:bg-[#2C2A30] rounded-[28px] border border-[#E3E1E6] dark:border-[#3D3B43] p-5">
                                        <div className="flex items-center justify-between mb-4">
                                            <h3 className="font-medium text-[#1D1B20] dark:text-[#E6E1E9] g-title">{t('calendar')}</h3>
                                            <div className="flex gap-2">
                                                <button onClick={() => { if (calendarMonth === 0) { setCalendarMonth(11);
                                                        setCalendarYear(calendarYear - 1); } else setCalendarMonth(calendarMonth - 1); }} className="p-1 rounded-full hover:bg-[#ECE6F0] dark:hover:bg-[#3D3B43]">
                                                    <ChevronLeft size={20} />
                                                </button>
                                                <span className="text-sm font-medium">{new Date(calendarYear, calendarMonth).toLocaleString('default', { month: 'long', year: 'numeric' })}</span>
                                                <button onClick={() => { if (calendarMonth === 11) { setCalendarMonth(0);
                                                        setCalendarYear(calendarYear + 1); } else setCalendarMonth(calendarMonth + 1); }} className="p-1 rounded-full hover:bg-[#ECE6F0] dark:hover:bg-[#3D3B43]">
                                                    <ChevronRight size={20} />
                                                </button>
                                            </div>
                                        </div>
                                        <div className="grid grid-cols-7 gap-1 text-center text-xs font-medium text-[#79747E] dark:text-[#88849A] mb-2">
                                            <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
                                        </div>
                                        <div className="space-y-1">
                                            {renderCalendar()}
                                        </div>
                                        <div className="flex gap-4 mt-4 text-xs">
                                            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-emerald-100 dark:bg-emerald-900/40"></span> Approved</span>
                                            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-amber-100 dark:bg-amber-900/40"></span> Pending</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {active === "payslips" && (
                                <div>
                                    <h2 className="text-[26px] font-medium text-[#1D1B20] dark:text-[#E6E1E9] g-title mb-5">{t('payslips')}</h2>
                                    <div className="bg-[#FFFBFE] dark:bg-[#2C2A30] rounded-[28px] border border-[#E3E1E6] dark:border-[#3D3B43] divide-y divide-[#ECEAF0] dark:divide-[#35333A]">
                                        {payslips.map(p => (
                                            <div key={p.id} className="flex items-center justify-between px-5 py-4">
                                                <div className="flex items-center gap-3">
                                                    <FileText size={18} className="text-[#0B57D0] dark:text-[#7BC0FF]" />
                                                    <p className="font-medium text-[#1D1B20] dark:text-[#E6E1E9]">{p.month}</p>
                                                </div>
                                                <div className="flex items-center gap-4">
                                                    <p className="font-semibold text-[#49454F] dark:text-[#A9A5B0]">${p.amount.toLocaleString()}</p>
                                                    <button onClick={() => printPayslip(p)} className="text-[#0B57D0] dark:text-[#7BC0FF] hover:underline text-sm flex items-center gap-1">
                                                        <Printer size={14} /> PDF
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {active === "documents" && (
                                <div>
                                    <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
                                        <h2 className="text-[26px] font-medium text-[#1D1B20] dark:text-[#E6E1E9] g-title">{t('documents')}</h2>
                                        <button onClick={() => {
                                            setDocuments(d => [{ id: Date.now(), name: `New Document ${d.length + 1}.pdf`, date: new Date().toISOString().slice(0, 10) }, ...d]);
                                            addToast("📄 Document uploaded", 'success');
                                            addNotification("Document uploaded.", 'success');
                                        }} className="bg-[#0B57D0] dark:bg-[#1A5A9A] hover:bg-[#0842A0] dark:hover:bg-[#2A6AAA] text-white text-sm font-semibold rounded-full px-4 py-2 flex items-center gap-1.5">
                                            <Upload size={16} /> Upload
                                        </button>
                                    </div>
                                    <div className="bg-[#FFFBFE] dark:bg-[#2C2A30] rounded-[28px] border border-[#E3E1E6] dark:border-[#3D3B43] divide-y divide-[#ECEAF0] dark:divide-[#35333A]">
                                        {documents.map(d => (
                                            <div key={d.id} className="flex items-center justify-between px-5 py-4 cursor-pointer hover:bg-[#F3F1F7] dark:hover:bg-[#35333A]" onClick={() => setShowDocPreview(d)}>
                                                <div className="flex items-center gap-3">
                                                    <FileText size={18} className="text-[#938F99] dark:text-[#88849A]" />
                                                    <p className="font-medium text-[#1D1B20] dark:text-[#E6E1E9]">{d.name}</p>
                                                </div>
                                                <p className="text-xs text-[#938F99] dark:text-[#88849A]">{d.date}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {active === "announcements" && (
                                <div>
                                    <h2 className="text-[26px] font-medium text-[#1D1B20] dark:text-[#E6E1E9] g-title mb-5">{t('announcements')}</h2>
                                    <div className="space-y-3">
                                        {sortedAnnouncements.map(a => (
                                            <div key={a.id} className={`bg-[#FFFBFE] dark:bg-[#2C2A30] rounded-[28px] border ${a.pinned ? 'border-[#0B57D0] dark:border-[#1A5A9A]' : 'border-[#E3E1E6] dark:border-[#3D3B43]'} p-5`}>
                                                <div className="flex items-start gap-2 flex-wrap">
                                                    {a.pinned && <span className="text-xs font-medium text-[#0B57D0] dark:text-[#7BC0FF]">📌 PINNED</span>}
                                                    <span className="text-xs text-[#79747E] dark:text-[#88849A]">{a.date}</span>
                                                    <span className="text-xs font-medium px-2 py-0.5 rounded-full bg-[#ECE6F0] dark:bg-[#35333A] text-[#49454F] dark:text-[#A9A5B0]">
                                                        {(!a.department || a.department === 'All') ? '🌐 All Employees' : `🏢 ${a.department}`}
                                                    </span>
                                                </div>
                                                <h3 className="font-medium text-[#1D1B20] dark:text-[#E6E1E9] text-lg mt-1">{a.title}</h3>
                                                <p className="text-[#49454F] dark:text-[#A9A5B0] text-sm mt-1">{a.content}</p>
                                            </div>
                                        ))}
                                        {visibleAnnouncements.length === 0 && <p className="text-[#79747E] dark:text-[#88849A]">{t('noData')}</p>}
                                    </div>
                                </div>
                            )}

                            {active === "leaderboard" && (
                                <div>
                                    <h2 className="text-[26px] font-medium text-[#1D1B20] dark:text-[#E6E1E9] g-title mb-5">{t('leaderboard')}</h2>
                                    <div className="bg-[#FFFBFE] dark:bg-[#2C2A30] rounded-[28px] border border-[#E3E1E6] dark:border-[#3D3B43] p-6">
                                        <div className="space-y-2">
                                            {leaderboard.map((emp, idx) => (
                                                <div key={emp.id} className={`flex items-center justify-between rounded-full px-4 py-2 ${emp.id === user.id ? 'bg-[#D3E3FD] dark:bg-[#1A3A6A]' : 'bg-[#F3F1F7] dark:bg-[#35333A]'}`}>
                                                    <div className="flex items-center gap-3">
                                                        <span className="text-sm font-bold text-[#49454F] dark:text-[#A9A5B0] w-6">#{idx + 1}</span>
                                                        <div className={`w-6 h-6 rounded-full ${emp.color} text-white flex items-center justify-center text-xs font-bold`}>
                                                            {emp.name.split(" ").map(n => n[0]).slice(0, 2).join("")}
                                                        </div>
                                                        <span className="text-sm font-medium text-[#1D1B20] dark:text-[#E6E1E9]">{emp.name} {emp.id === user.id && '(You)'}</span>
                                                    </div>
                                                    <span className="text-sm font-bold text-amber-500">{emp.points || 0} pts</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {showRequest && (
                        <Modal title={t('requestLeave')} onClose={() => setShowRequest(false)}>
                            <div className="space-y-3">
                                <select value={form.type} onChange={e => setForm({ ...form, type: e.target.value })} className="w-full bg-[#ECE6F0] dark:bg-[#35333A] rounded-full px-5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#0B57D0] dark:focus:ring-[#1A5A9A] text-[#1D1B20] dark:text-[#E6E1E9]">
                                    {["Vacation", "Sick", "Personal"].map(t => <option key={t}>{t}</option>)}
                                </select>
                                <div className="flex gap-3">
                                    <div className="flex-1">
                                        <label className="text-xs text-[#79747E] dark:text-[#88849A]">From</label>
                                        <input type="date" value={form.from} onChange={e => setForm({ ...form, from: e.target.value })} className="w-full bg-[#ECE6F0] dark:bg-[#35333A] rounded-full px-5 py-2.5 text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-[#0B57D0] dark:focus:ring-[#1A5A9A] text-[#1D1B20] dark:text-[#E6E1E9]" />
                                    </div>
                                    <div className="flex-1">
                                        <label className="text-xs text-[#79747E] dark:text-[#88849A]">To</label>
                                        <input type="date" value={form.to} onChange={e => setForm({ ...form, to: e.target.value })} className="w-full bg-[#ECE6F0] dark:bg-[#35333A] rounded-full px-5 py-2.5 text-sm mt-1 focus:outline-none focus:ring-2 focus:ring-[#0B57D0] dark:focus:ring-[#1A5A9A] text-[#1D1B20] dark:text-[#E6E1E9]" />
                                    </div>
                                </div>
                                <button onClick={submitLeave} className="w-full bg-[#0B57D0] dark:bg-[#1A5A9A] hover:bg-[#0842A0] dark:hover:bg-[#2A6AAA] text-white font-semibold rounded-full py-2.5">{t('requestLeave')}</button>
                            </div>
                        </Modal>
                    )}

                    {showDocPreview && (
                        <Modal title={showDocPreview.name} onClose={() => setShowDocPreview(null)} maxW="max-w-2xl">
                            <div className="bg-[#F3F1F7] dark:bg-[#35333A] rounded-[20px] p-8 text-center">
                                <FileText size={48} className="mx-auto text-[#0B57D0] dark:text-[#7BC0FF] mb-4" />
                                <p className="text-[#49454F] dark:text-[#A9A5B0]">{showDocPreview.name}</p>
                                <p className="text-xs text-[#79747E] dark:text-[#88849A]">Uploaded on {showDocPreview.date}</p>
                                <button className="mt-4 bg-[#0B57D0] dark:bg-[#1A5A9A] hover:bg-[#0842A0] dark:hover:bg-[#2A6AAA] text-white font-medium rounded-full px-6 py-2 text-sm">
                                    <Download size={16} className="inline mr-2" /> Download
                                </button>
                            </div>
                        </Modal>
                    )}
                </div>
                </>
            );
        }

        // ─── Root ──────────────────────────────────────────────────────────────────

        function PeopleHubHRMS() {
            const [screen, setScreen] = useState("admin-login");
            const [user, setUser] = useState(null);
            const [state, dispatch] = useReducer(appReducer, {
                ...initialState,
                ...getInitialData(),
            });

            const handleAdminLogin = (userData) => {
                setUser(userData);
                setScreen("admin-app");
            };

            const handleEmployeeLogin = (userData) => {
                setUser(userData);
                setScreen("employee-app");
            };

            const handleLogout = () => {
                setUser(null);
                setScreen("admin-login");
            };

            return (
                <AppContext.Provider value={{ state, dispatch }}>
                    <ThemeProvider>
                        <ToastProvider>
                            {screen === "admin-login" && <AdminLogin onLogin={handleAdminLogin} goEmployee={() => setScreen("employee-login")} />}
                            {screen === "employee-login" && <EmployeeLogin onLogin={handleEmployeeLogin} goAdmin={() => setScreen("admin-login")} />}
                            {screen === "admin-app" && <AdminApp onLogout={handleLogout} user={user} />}
                            {screen === "employee-app" && <EmployeeApp onLogout={handleLogout} user={user} />}
                        </ToastProvider>
                    </ThemeProvider>
                </AppContext.Provider>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<PeopleHubHRMS />);
    </script>
</body>
</html>
